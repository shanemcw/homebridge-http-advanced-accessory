name: Compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        homebridge: ['1', '2']
    runs-on: ubuntu-latest
    env:
      HB_TEST_VERSION: ${{ matrix.homebridge }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
